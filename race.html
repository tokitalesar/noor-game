html,body{margin:0;height:100%;background:var(--navy);overflow:hidden}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;overflow:hidden;border-radius:18px;font-family:Tajawal,system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-tap-highlight-color:transparent;transform-origin:center}
.scr{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
.scr.on{display:block}
.scr>*{position:absolute}
.scr::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#15163Ab8,#15163A77 40%,#15163Ae6)}
h1{margin:0;top:14px;left:0;right:0;text-align:center;font-size:54px;font-weight:800;color:var(--gold);text-shadow:0 3px 14px #000a;line-height:1.3}
.btn{font-family:inherit;font-weight:800;font-size:32px;border:0;border-radius:60px;padding:14px 46px;cursor:pointer;background:linear-gradient(180deg,#FFD679,var(--gold));color:var(--navy);box-shadow:0 6px 0 #B98419,0 12px 24px #0007;transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B98419}
.btn.ghost{background:#15163Acc;color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold);font-size:22px;padding:10px 28px}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
/* intro */
#intro{background-image:var(--imam)}
.bubble{bottom:150px;right:60px;left:60px;background:var(--cream);color:var(--navy);border-radius:34px;padding:22px 40px;font-size:31px;font-weight:700;line-height:1.7;box-shadow:0 14px 40px #0008}
.bubble::after{content:"";position:absolute;top:-26px;left:50%;margin-left:-26px;border:26px solid transparent;border-bottom-color:var(--cream);border-top:0}
.tag{top:30px;right:50px;font-size:24px;background:#15163Ad9;color:var(--gold);border-radius:30px;padding:6px 22px;font-weight:800}
.setup{bottom:34px;left:0;right:0;display:flex;gap:18px;justify-content:center;align-items:center}
.setup .ask{font-size:30px;font-weight:800}
.nb{width:78px;height:78px;border-radius:50%;border:5px solid var(--gold);background:#15163Ae6;color:var(--gold);font-family:inherit;font-size:42px;font-weight:800;cursor:pointer;transition:transform .15s,background .2s}
.nb.sel{background:var(--gold);color:var(--navy);transform:scale(1.1)}
/* play */
#play{background-image:var(--portal)}
.tm{top:84px;left:0;right:0;display:flex;gap:12px;justify-content:center}
.chip{display:inline-flex;gap:8px;align-items:center;background:#15163Ad9;border:3px solid;border-radius:40px;padding:4px 18px;font-weight:800;font-size:24px;transition:transform .25s,background .25s}
.chip.on{transform:scale(1.12);background:#2a2d68}
.chip b{color:var(--gold)}
#track{left:40px;right:40px;top:135px;height:300px}
.ln{position:absolute;left:0;right:0;border-radius:60px;background:#15163Aeb;border:4px solid;box-sizing:border-box}

function drawTm(){var h="";for(var i=0;i<T;i++)h+='<span class="chip'+(i==turn?" on":"")+'" id="t'+i+'" style="border-color:'+COLS[i]+'">الفريق '+ar(i+1)+' <b id="s'+i+'">'+ar(sc[i])+'/'+ar(G)+'</b> 🏁</span>';$("tm").innerHTML=h}
function ask(){busy=false;drawTm();if(qi>=qs.length){qs=shuf(QS);qi=0}var q=qs[qi++],os=shuf(q.o.map(function(t,k){return{t:t,ok:k==0}}));
 var h='<div class="qh"><i class="ai"></i><span class="who" style="color:'+COLS[turn]+'">الفريق '+ar(turn+1)+'</span><div class="qq">'+q.q+'</div></div><div id="opts">';os.forEach(function(o){h+='<button class="opt" data-ok="'+(o.ok?1:0)+'">'+o.t+'</button>'});h+='</div><div id="msg"></div>';$("qa").innerHTML=h;
 document.querySelectorAll("#qa .opt").forEach(function(b){b.onclick=function(){if(busy)return;busy=true;var ok=b.dataset.ok==="1";b.classList.add(ok?"good":"bad");
  if(!ok)document.querySelectorAll("#qa .opt").forEach(function(x){if(x.dataset.ok==="1")x.classList.add("good")});
  if(ok){sGood();sc[turn]=Math.min(G,sc[turn]+1);advance(turn);$("msg").textContent="أحسنتنّ! 🎉 تقدمت هجينكنّ خطوة"}else{sBad();$("msg").innerHTML="إجابة غير صحيحة 😢 "+q.e}
  setTimeout(nextTurn,ok?1800:3000)}})}
function advance(t){var c=$("c"+t);c.style.right=(START+sc[t]/G*MAXR)+"px";c.classList.add("run");setTimeout(function(){c.classList.remove("run")},1000);$("s"+t).textContent=ar(sc[t])+"/"+ar(G)}
function nextTurn(){var done=sc.some(function(v){return v>=G});if(done&&turn==T-1)return finish();turn=(turn+1)%T;ask()}
function finish(){over=true;var mx=Math.max.apply(null,sc),w=[];sc.forEach(function(v,k){if(v==mx)w.push(k)});
 var t=w.length==1?'فاز الفريق '+ar(w[0]+1)+'!':'تعادل بين الفرق '+w.map(function(k){return ar(k+1)}).join(" و");
 $("end").innerHTML='<div class="a">🏆</div><div class="b">'+t+'</div><div class="c">'+(mx>=G?"وصل إلى خط النهاية أولًا":"الأقرب إلى خط النهاية")+'</div><div style="font-size:24px;opacity:.85;margin-bottom:10px">أُكمل الدور الأخير ليلعب كل فريق عددًا متساويًا من المرات</div><button class="btn" id="again">العب مرة أخرى</button>';$("end").classList.add("on");$("again").onclick=start;sGood();confetti();emo(["🏆","⭐","💖","😍","🌟"],24)}

function tick(){cx.clearRect(0,0,1280,720);PA=PA.filter(function(p){return p.l>0});PA.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.l--;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});if(PA.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,1280,720)}}
